# Kotost Bust (id kotost_body): a bust drawn from the skin (your own by default), its jiggle while walking and
# jumping, an hourglass body for every bust wearer, chestplates in the figure's shape.
# First person is its own mod now: Kotost First Person (kotost_firstperson); each works alone or with the other.
# Native mod for Horizon nightly-2026-11-08-fdc87ae (docs/native-mods.md, horizon-mixins).
[mod]
id = "kotost_body"
version = "0.4.0"
priority = 100

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# State and physics, in horizon-client-lib's root so both crates reach it (horizon_client::kotost_body).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/client_lib.rs"
name = "kotost_body"
source = "runtime.rs"
visibility = "pub"

# --- bust ---------------------------------------------------------------------------------------
[[injection]]
id = "bust-wearer"
kind = "HEAD"
target = "horizon_client::game::cosmetics::Game<'_>::cosmetics_geometry"
helper = "bust_wearer.rs"
bindings = [
  { name = "m", ty = "&Mob", value = "m" },
  { name = "own", ty = "bool", value = "own" },
  { name = "alpha", ty = "f32", value = "alpha" },
]

[[injection]]
id = "bust-pose"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::cosmetics::Game<'_>::cosmetics_model"
helper = "bust_pose.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "model", ty = "&Arc<Part>", value = "model" },
  { name = "matrix", ty = "glam::Mat4", value = "matrix" },
  { name = "poses", ty = "&Poses", value = "poses" },
  { name = "uv", ty = "[f32; 4]", value = "uv" },
  { name = "light", ty = "u32", value = "light" },
  { name = "gpu", ty = "bool", value = "gpu" },
  { name = "bounds", ty = "Option<(glam::Vec3, glam::Vec3)>", value = "bounds" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]

# Every player's bust from their own skin (kotost-body.txt picks who): beside the elytra layer, which
# both the local player's model and other players' run, in third and first person.
[[injection]]
id = "skin-bust"
kind = "HEAD"
target = "horizon_client::game::perspective::Game<'_>::player_elytra_geometry"
helper = "skin_bust.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "m", ty = "&Mob", value = "m" },
  { name = "chest", ty = "Option<&str>", value = "chest" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "partial", ty = "f32", value = "partial" },
  { name = "light", ty = "u32", value = "light" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

# --- the hourglass body ---------------------------------------------------------------------------
# The mob being posed, for body-shape-poses below (which leaves an hourglass player's torso box undrawn;
# skin-bust draws the hourglass in its place).
[[injection]]
id = "body-shape-mob"
kind = "HEAD"
target = "horizon_client_lib::mobs::anim::setup"
helper = "body_shape_mob.rs"
bindings = [{ name = "m", ty = "&Mob", value = "m" }]

[[injection]]
id = "body-shape-poses"
kind = "HEAD"
target = "horizon_client_lib::mobs::anim::player_model_visibility"
helper = "body_shape_poses.rs"
bindings = [{ name = "p", ty = "&mut Poses", value = "&mut *p" }]
